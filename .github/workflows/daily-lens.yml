name: Daily Lens

# Publishes "The Lens" — the daily MLB column. The edition's theme rotates by
# weekday inside the generator. Needs the repo secret ANTHROPIC_API_KEY for the
# AI prose (without it the generator falls back to template prose).

on:
  schedule:
    - cron: "0 12 * * *"      # 12:00 UTC daily (~8am ET / 2pm Amsterdam)
  workflow_dispatch:           # also runnable manually from the Actions tab

permissions:
  contents: write              # lets the job commit & push the new article

concurrency:
  group: daily-lens
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The Lens rests between seasons: the last edition is the morning after
      # the final regular-season day, the first is Opening Day. Manual runs
      # from the Actions tab skip this check and always publish.
      - name: Is the regular season on?
        id: season
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, urllib.request
          today = dt.datetime.now(dt.timezone.utc).date()
          url = f"https://statsapi.mlb.com/api/v1/seasons/{today.year}?sportId=1"
          s = json.load(urllib.request.urlopen(url, timeout=30))["seasons"][0]
          start = dt.date.fromisoformat(s["regularSeasonStartDate"])
          end = dt.date.fromisoformat(s["regularSeasonEndDate"]) + dt.timedelta(days=1)
          print(f"on={'true' if start <= today <= end else 'false'}")
          PY

      - uses: actions/checkout@v4
        if: steps.season.outputs.on != 'false'

      - uses: actions/setup-python@v5
        if: steps.season.outputs.on != 'false'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.season.outputs.on != 'false'
        run: pip install -r tools/requirements.txt

      - name: Generate today's edition
        id: generate
        if: steps.season.outputs.on != 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/generate_weekly.py

      - name: Commit & push if changed
        if: steps.season.outputs.on != 'false'
        run: |
          git config user.name "Baseball Lens Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ data/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "The Lens: daily edition $(date -u +%F)"
            git push
          fi

      # The edition is published by now; fail the run only so the red X and
      # GitHub's failure email make a template-prose day impossible to miss.
      - name: Flag an edition published without AI prose
        if: steps.generate.outputs.llm_failed == 'true'
        run: |
          echo "Today's edition shipped with template prose — see the error above."
          exit 1
