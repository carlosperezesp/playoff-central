<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Matchup — Baseball Lens</title>
<link rel="icon" type="image/png" href="./icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f3efe0; --ink-dim:rgba(243,239,224,.55); --ink-soft:rgba(243,239,224,.32);
    --line:rgba(243,239,224,.13); --gold:#e8c23a; --muted:#9fb4a6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Barlow Condensed',system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background:#0d1a12 radial-gradient(120% 75% at 50% -8%, #223d2a 0%, #16281c 52%, #0d1a1200 100%) fixed;
    padding:24px 14px 70px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto}

  /* ── Page header ─────────────────────────────────────────── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;overflow:hidden}
  .brand-ico img{width:100%;height:100%;object-fit:cover;display:block}
  .brand-txt{font-family:'Bebas Neue';font-size:27px;letter-spacing:2.5px;line-height:1;color:#fff}
  .brand-txt b{font-weight:400;color:#3ddc7f}
  .top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .back-pill{font-weight:800;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink);
    border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;text-decoration:none;
    background:rgba(243,239,224,.04);transition:background .15s,border-color .15s}
  .back-pill:hover{background:rgba(243,239,224,.1);border-color:rgba(243,239,224,.28)}
  .top-pill{font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);
    border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;white-space:nowrap}
  .lede{font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.6;color:var(--ink-dim);max-width:70ch;margin-bottom:6px}
  .lede b{color:var(--ink);font-weight:600}
  .meta{font-weight:700;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);
    margin-bottom:18px}

  /* ── Team pickers ────────────────────────────────────────── */
  .pickers{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:22px}
  select{font-family:inherit;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink);background:rgba(243,239,224,.06);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;width:100%;cursor:pointer;appearance:none}
  select:focus{outline:none;border-color:rgba(243,239,224,.35)}
  option{background:#16281c;color:var(--ink)}
  .vs{font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:var(--ink-soft)}
  .swap{font-family:inherit;font-weight:800;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--ink-dim);background:none;border:0;cursor:pointer;padding:4px}
  .swap:hover{color:var(--ink)}

  /* ── Comparison blocks ───────────────────────────────────── */
  .block{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;
    background:rgba(243,239,224,.02)}
  .block-hd{display:flex;align-items:center;gap:12px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  .block-title{font-weight:800;font-size:12.5px;letter-spacing:2.4px;text-transform:uppercase}
  .block-sub{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink-soft)}

  .scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px}
  .side{display:flex;flex-direction:column;gap:5px}
  .side.b{align-items:flex-end}
  .side-team{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:1.2px}
  .side.b .side-team{flex-direction:row-reverse}
  .side-team img{width:26px;height:26px;object-fit:contain}
  .side-num{font-family:'Bebas Neue';font-size:44px;line-height:.9;letter-spacing:1px}
  .edge{font-weight:800;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);
    text-align:center;white-space:nowrap}
  .edge b{display:block;font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;color:var(--gold);font-weight:400}

  .bar{height:7px;border-radius:99px;overflow:hidden;display:flex;margin:0 16px 14px}
  .bar i{display:block;height:100%}

  .rosters{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
  .roster{padding:12px 16px 14px}
  .roster + .roster{border-left:1px solid var(--line)}
  .man{display:flex;align-items:center;gap:9px;padding:4px 0}
  .man-n{font-weight:800;font-size:11.5px;padding:2px 6px;border-radius:4px;min-width:34px;text-align:center;
    flex-shrink:0}
  .man-name{font-weight:600;font-size:13.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .man-slot{font-weight:800;font-size:9.5px;letter-spacing:1px;color:var(--ink-soft);flex-shrink:0}
  .thin{font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-soft);padding:6px 0}

  .state{padding:60px 10px;text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--ink-soft)}
  .note{font-family:'Inter',sans-serif;font-size:12px;line-height:1.6;color:var(--ink-soft);margin-top:20px}

  @media (max-width:640px){
    .brand-txt{font-size:22px}.back-pill{font-size:10px;padding:6px 10px;letter-spacing:1px}
    .top-pill{font-size:10px;padding:6px 11px;letter-spacing:1.2px}
    .side-num{font-size:34px}
    .rosters{grid-template-columns:1fr}
    .roster + .roster{border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand">
        <span class="brand-ico"><img src="./icon.png" alt="Baseball Lens logo"></span>
        <span class="brand-txt">BASEBALL <b>LENS</b></span>
      </div>
      <div class="top-actions">
        <a class="back-pill" id="backPill" href="index.html#rankings">&larr; Rankings</a>
        <div class="top-pill">Matchup</div>
      </div>
    </div>
    <p class="lede">Two clubs side by side on the three things that decide a game:
      <b>rotation</b>, <b>bullpen</b> and <b>lineup</b>. Every number here is the same one the
      Rotation, Bullpen and Batters indexes show — same arms, same bats, same formulas.</p>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <div class="pickers" id="pickers" hidden>
    <select id="teamA" aria-label="Home club"></select>
    <div style="text-align:center">
      <div class="vs">VS</div>
      <button class="swap" type="button" onclick="swapTeams()">swap</button>
    </div>
    <select id="teamB" aria-label="Visiting club"></select>
  </div>

  <div id="board" class="state">Loading matchup…</div>

  <p class="note" id="note" hidden></p>
</div>

<script>
const API = 'https://statsapi.mlb.com/api/v1';
const WINDOW_DAYS = 30;

// ── Scoring constants, copied verbatim from the three index pages so a club's
// number here can never disagree with the number on its own board ────────────
const MIN_IP = 10;          // rotation: a spot starter with 5 innings is not a member
const MIN_APPS = 3;         // bullpen: one mop-up appearance is not membership
const FLOOR_AT = 60;        // ...but a reliever needs ~60 team games to bank 10 innings
const PEN_SIZE = 8;
const MIN_PA = 25, PA_AT = 40;
const SLOTS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];
const OF = new Set(['LF','CF','RF','OF']);

const ERA_BEST = 1.50, ERA_WORST = 6.00, WHIP_BEST = 0.80, WHIP_WORST = 2.00;
function forma(era, whip) {
  const p = [];
  if (era  != null && isFinite(era))  p.push(Math.max(0, Math.min(100, (ERA_WORST  - era)  / (ERA_WORST  - ERA_BEST)  * 100)));
  if (whip != null && isFinite(whip)) p.push(Math.max(0, Math.min(100, (WHIP_WORST - whip) / (WHIP_WORST - WHIP_BEST) * 100)));
  return p.length ? Math.round(p.reduce((a,b)=>a+b,0) / p.length) : null;
}
const TIERS = ['#16a34a','#b1c882','#ffc000','#ff8100','#ff2200'];
const tierForm = f => f == null ? '#9ca3af' : f >= 75 ? TIERS[0] : f >= 60 ? TIERS[1] : f >= 40 ? TIERS[2] : f >= 25 ? TIERS[3] : TIERS[4];
const scale = (v, c) => (v == null || v <= 0) ? '#9ca3af'
  : v >= c[0] ? TIERS[0] : v >= c[1] ? TIERS[1] : v >= c[2] ? TIERS[2] : v >= c[3] ? TIERS[3] : TIERS[4];
const tierOps = o => scale(o, [.900, .750, .600, .450]);
const shade = (h,r) => { const n=parseInt(h.slice(1),16),R=Math.round(((n>>16)&255)*(1-r)),G=Math.round(((n>>8)&255)*(1-r)),B=Math.round((n&255)*(1-r));
  return '#'+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1); };
const onTier = c => (c === '#ff8100' || c === '#ff2200' || c === '#9ca3af') ? '#fff' : shade(c,.62);

const PRIMARY = {108:'#BA0021',109:'#A71930',110:'#DF4601',111:'#BD3039',112:'#0E3386',113:'#C6011F',114:'#00385D',
  115:'#33006F',116:'#0C2340',117:'#002D62',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#002D72',133:'#003831',
  134:'#FDB827',135:'#2F241D',136:'#0C2C56',137:'#FD5A1E',138:'#C41E3A',139:'#092C5C',140:'#003278',141:'#134A8E',
  142:'#002B5C',143:'#E81828',144:'#CE1141',145:'#27251F',146:'#00A3E0',147:'#003087',158:'#12284B'};

const logo = id => `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${id}.svg`;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ipToFloat = ip => { const s=String(ip ?? '0'); if(!s.includes('.')) return parseFloat(s)||0;
  const [w,f]=s.split('.'); return (parseInt(w,10)||0)+(parseInt(f,10)||0)/3; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const int = v => parseInt(v, 10) || 0;
const isStarter = ln => !!ln && (ln.gs >= 3 || (ln.g >= 3 && ln.gs / ln.g >= 0.5));
const posOf = p => { const a = (p.primaryPosition || {}).abbreviation; return (a === 'TWP' || a === 'P') ? 'DH' : a; };
const fj = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const opsPool = rows => {
  const t = rows.reduce((a,s) => ({ ab:a.ab+s.ab, h:a.h+s.h, bb:a.bb+s.bb, hbp:a.hbp+s.hbp, sf:a.sf+s.sf,
    tb:a.tb+s.tb, pa:a.pa+s.pa }), {ab:0,h:0,bb:0,hbp:0,sf:0,tb:0,pa:0});
  const onBase = t.ab + t.bb + t.hbp + t.sf;
  t.obp = onBase > 0 ? (t.h + t.bb + t.hbp) / onBase : null;
  t.slg = t.ab > 0 ? t.tb / t.ab : null;
  t.ops = (t.obp != null && t.slg != null) ? t.obp + t.slg : null;
  return t;
};

function fillLineup(cands) {
  const used = new Set(), out = [];
  const take = (slot, pick) => { if (!pick) return; used.add(pick.pid); out.push({ ...pick, slot }); };
  SLOTS.forEach(slot => take(slot, cands.find(c => !used.has(c.pid) && c.pos === slot)));
  ['LF','CF','RF'].forEach(slot => {
    if (out.some(o => o.slot === slot)) return;
    take(slot, cands.find(c => !used.has(c.pid) && OF.has(c.pos)));
  });
  if (!out.some(o => o.slot === 'DH')) take('DH', cands.find(c => !used.has(c.pid)));
  return out.sort((a,b) => (a.starts ? a.slotSum / a.starts : 99) - (b.starts ? b.slotSum / b.starts : 99));
}

// Send the reader back where they came from. ?from= travels in the URL rather
// than relying on the referrer, so it survives a reload or a new tab.
const BACK = {
  topgames: ['index.html#topgames', 'Top Games'],
  rankings: ['index.html#rankings', 'Rankings'],
};
(function setBackPill() {
  const [href, label] = BACK[new URLSearchParams(location.search).get('from')] || BACK.rankings;
  const pill = document.getElementById('backPill');
  pill.href = href;
  pill.innerHTML = `&larr; ${label}`;
})();

// ── State ────────────────────────────────────────────────────────────────────
let SEASON = new Date().getFullYear();
let META = {};              // teamId → {id, name, abbr}
let ROT = {}, PEN = {}, BAT = {};   // teamId → {score, men:[]}
let A = null, B = null;

// ── Load: league-wide stats once, rosters only for the two clubs on screen ───
async function load() {
  const end = new Date(), start = new Date();
  start.setDate(start.getDate() - (WINDOW_DAYS - 1));

  // A season that hasn't thrown a pitch yet means we're in the winter — show the last one
  const standings = await fj(`${API}/standings?leagueId=103,104&season=${SEASON}`).catch(() => ({}));
  const recs = (standings.records || []).flatMap(r => r.teamRecords || []);
  if (recs.length && !recs.some(t => (t.wins || 0) + (t.losses || 0) > 0)) SEASON -= 1;
  const games = recs.length ? recs.reduce((a,t) => a + (t.wins||0) + (t.losses||0), 0) / recs.length : 0;
  const ipFloor = games ? Math.max(2, Math.min(MIN_IP, MIN_IP * games / FLOOR_AT)) : MIN_IP;
  const paFloor = games ? Math.max(5, Math.min(MIN_PA, MIN_PA * games / PA_AT)) : MIN_PA;

  const [teamList, post, schedPitch, schedLineups, seasonPitch, windowPitch, seasonHit] = await Promise.all([
    fj(`${API}/teams?sportId=1&season=${SEASON}`),
    fj(`${API}/schedule?sportId=1&startDate=${ymd(start)}&endDate=${ymd(end)}&gameType=F,D,L,W`)
      .then(d => (d.dates || []).some(x => (x.games || []).length)).catch(() => false),
    fj(`${API}/schedule?sportId=1&startDate=${ymd(start)}&endDate=${ymd(end)}&gameType=R&hydrate=probablePitcher,team`),
    fj(`${API}/schedule?sportId=1&startDate=${ymd(start)}&endDate=${ymd(end)}&gameType=R,F,D,L,W&hydrate=lineups`),
    fj(`${API}/stats?stats=season&season=${SEASON}&sportId=1&group=pitching&gameType=R&playerPool=All&limit=2000`),
    fj(`${API}/stats?stats=byDateRange&startDate=${ymd(start)}&endDate=${ymd(end)}&season=${SEASON}&sportId=1&group=pitching&gameType=R&playerPool=All&limit=2000`),
    fj(`${API}/stats?stats=season&season=${SEASON}&sportId=1&group=hitting&gameType=R&playerPool=All&limit=2000`),
  ]);

  (teamList.teams || []).forEach(t => META[t.id] = { id: t.id, name: t.teamName || t.name, abbr: t.abbreviation || '' });

  // Season lines, keyed by player
  const pit = {};
  ((seasonPitch.stats || [])[0]?.splits || []).forEach(s => {
    const st = s.stat || {};
    pit[s.player.id] = { fullName: s.player.fullName, g: int(st.gamesPlayed), gs: int(st.gamesStarted),
      era: num(st.era), whip: num(st.whip), ip: ipToFloat(st.inningsPitched) };
  });
  const hit = {};
  ((seasonHit.stats || [])[0]?.splits || []).forEach(s => {
    const st = s.stat || {};
    hit[s.player.id] = { fullName: s.player.fullName, ops: num(st.ops), pa: int(st.plateAppearances),
      ab: int(st.atBats), h: int(st.hits), tb: int(st.totalBases), bb: int(st.baseOnBalls),
      hbp: int(st.hitByPitch), sf: int(st.sacFlies) };
  });

  // Rotation: starts per club in the window, and where each arm last started
  const rotBy = {}, lastStart = {};
  (schedPitch.dates || []).forEach(d => (d.games || []).forEach(g => {
    ['away','home'].forEach(side => {
      const t = g.teams[side], team = t.team, pp = t.probablePitcher;
      if (!team?.id || !pp?.id) return;
      const bag = rotBy[team.id] = rotBy[team.id] || {};
      const e = bag[pp.id] = bag[pp.id] || { pid: pp.id, name: pp.fullName, starts: 0 };
      e.starts++;
      if (!lastStart[pp.id] || d.date >= lastStart[pp.id].date) lastStart[pp.id] = { date: d.date, team: team.id };
    });
  }));
  const rotRoster = post || !(schedPitch.dates || []).some(d => (d.games || []).length);

  // Bullpen: relief work in the window, by the club he actually worked for
  const penBy = {};
  const windowSplits = (windowPitch.stats || [])[0]?.splits || [];
  windowSplits.forEach(s => {
    const st = s.stat || {}, tid = s.team?.id;
    if (!tid || !META[tid]) return;
    const apps = int(st.gamesPlayed) - int(st.gamesStarted);
    if (int(st.gamesStarted) > 0 || apps < MIN_APPS) return;
    (penBy[tid] = penBy[tid] || []).push({ pid: s.player.id, name: s.player.fullName, apps });
  });
  const penRoster = post || !windowSplits.length;

  // Lineup: every lineup card of the window
  const batBy = {};
  (schedLineups.dates || []).forEach(d => (d.games || []).forEach(g => {
    const lu = g.lineups; if (!lu) return;
    [['home','homePlayers'],['away','awayPlayers']].forEach(([side, key]) => {
      const tid = g.teams?.[side]?.team?.id; if (!tid || !META[tid]) return;
      (lu[key] || []).forEach((p, i) => {
        const bag = batBy[tid] = batBy[tid] || {};
        const e = bag[p.id] = bag[p.id] || { pid: p.id, name: p.fullName, pos: posOf(p), starts: 0, slotSum: 0 };
        e.starts++; e.slotSum += i + 1;
      });
    });
  }));
  const batRoster = !Object.keys(batBy).length;

  // Only the two clubs on screen need a roster call — the index pages fetch 30
  // because they rank 30; here two is the whole board.
  window._build = async (id) => {
    if (ROT[id]) return;
    const r = await fj(`${API}/teams/${id}/roster/40Man`).catch(() => null);
    const act = new Set(), actBat = new Set(), rosterPos = {};
    (r?.roster || []).forEach(e => {
      if ((e.status?.code || '') !== 'A') return;
      act.add(e.person.id);
      if (e.position?.abbreviation !== 'P') {
        actBat.add(e.person.id);
        const a = e.position?.abbreviation;
        rosterPos[e.person.id] = (a === 'TWP') ? 'DH' : a;
      }
    });
    const live = r ? act : null, liveBat = r ? actBat : null;

    // ── Rotation ──
    const rotPool = rotRoster
      ? [...(live || [])].filter(pid => isStarter(pit[pid])).map(pid => ({ pid, name: pit[pid].fullName, starts: pit[pid].gs }))
      : Object.values(rotBy[id] || {}).filter(s => lastStart[s.pid]?.team === id).filter(s => !live || live.has(s.pid));
    const starters = rotPool
      .map(s => { const ln = pit[s.pid] || { ip:0 }; return { ...s, ...ln, form: forma(ln.era, ln.whip) }; })
      .filter(s => rotRoster || s.ip >= MIN_IP)
      .sort((a,b) => b.starts - a.starts || b.ip - a.ip).slice(0, 5)
      .sort((a,b) => (b.form ?? -1) - (a.form ?? -1));
    ROT[id] = { score: weighted(starters), men: starters.map(s => ({ n: s.form, name: s.name })) };

    // ── Bullpen ──
    const penPool = penRoster
      ? [...(live || [])].filter(pid => pit[pid] && !isStarter(pit[pid])).map(pid => ({ pid, name: null, apps: 0 }))
      : (penBy[id] || []).filter(r2 => !live || live.has(r2.pid));
    const arms = penPool
      .map(r2 => { const ln = pit[r2.pid]; return ln ? { ...r2, ...ln, name: r2.name || ln.fullName, form: forma(ln.era, ln.whip) } : null; })
      .filter(s => s && (penRoster || s.ip >= ipFloor))
      .sort((a,b) => b.apps - a.apps || b.ip - a.ip).slice(0, PEN_SIZE)
      .sort((a,b) => (b.form ?? -1) - (a.form ?? -1));
    PEN[id] = { score: weighted(arms), men: arms.map(s => ({ n: s.form, name: s.name })) };

    // ── Lineup ──
    let cands = batRoster
      ? [...(liveBat || [])].filter(pid => hit[pid]).map(pid => ({ pid, name: hit[pid].fullName, pos: rosterPos[pid] || null, starts: 0, slotSum: 0 }))
      : Object.values(batBy[id] || {}).filter(c => !liveBat || liveBat.has(c.pid));
    cands = cands.map(c => { const ln = hit[c.pid]; return ln ? { ...c, ...ln, name: c.name || ln.fullName } : null; })
      .filter(c => c && (batRoster || c.pa >= paFloor))
      .sort((a,b) => b.starts - a.starts || b.pa - a.pa);
    const lineup = fillLineup(cands);
    const agg = opsPool(lineup);
    BAT[id] = { score: agg.ops, men: lineup.map(s => ({ n: s.ops, name: s.name, slot: s.slot })) };
  };

  document.getElementById('meta').textContent =
    `${SEASON} season · as of ${ymd(end)} · rotation and bullpen from the last ${WINDOW_DAYS} days`;
  buildPickers();
}

// Innings-weighted mean of the arms' FORM — the same aggregation both pitching boards use
function weighted(men) {
  let wsum = 0, ipsum = 0;
  men.forEach(s => { if (s.form != null && s.ip > 0) { wsum += s.form * s.ip; ipsum += s.ip; } });
  return ipsum > 0 ? Math.round(wsum / ipsum) : null;
}

// ── UI ───────────────────────────────────────────────────────────────────────
function buildPickers() {
  const opts = Object.values(META).sort((a,b) => a.name.localeCompare(b.name))
    .map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const q = new URLSearchParams(location.search);
  const ids = Object.keys(META).map(Number);
  A = parseInt(q.get('a'), 10); B = parseInt(q.get('b'), 10);
  if (!META[A]) A = ids.sort((x,y) => META[x].name.localeCompare(META[y].name))[0];
  if (!META[B] || B === A) B = ids.find(i => i !== A);

  for (const [el, val] of [['teamA', A], ['teamB', B]]) {
    const sel = document.getElementById(el);
    sel.innerHTML = opts;
    sel.value = String(val);
    sel.onchange = () => { A = +document.getElementById('teamA').value; B = +document.getElementById('teamB').value; render(); };
  }
  document.getElementById('pickers').hidden = false;
  render();
}

function swapTeams() {
  [A, B] = [B, A];
  document.getElementById('teamA').value = String(A);
  document.getElementById('teamB').value = String(B);
  render();
}

async function render() {
  const board = document.getElementById('board');
  if (A === B) { board.className = 'state'; board.textContent = 'Pick two different clubs'; return; }
  board.className = 'state'; board.textContent = 'Loading matchup…';

  // Keep ?from= across team changes, or a reload would forget where to go back to
  const from = new URLSearchParams(location.search).get('from');
  history.replaceState(null, '', `${location.pathname}?a=${A}&b=${B}${from ? `&from=${from}` : ''}`);

  try { await Promise.all([window._build(A), window._build(B)]); }
  catch (e) { board.className = 'state'; board.textContent = 'Could not load — ' + e.message; return; }

  board.className = '';
  board.innerHTML = [
    blockHTML('Rotation', 'Five current starters, FORM weighted by innings', ROT, v => v ?? '—', tierForm),
    blockHTML('Bullpen', 'The arms the manager actually calls, FORM weighted by innings', PEN, v => v ?? '—', tierForm),
    blockHTML('Lineup', 'The nine who take the field, pooled into one OPS', BAT, d3, tierOps),
  ].join('');

  document.getElementById('note').hidden = false;
  document.getElementById('note').textContent =
    'Higher is better in all three. A club missing a starter or a bat shows the men it actually has — '
    + 'open its own index for who is unavailable.';
}

const d3 = v => v == null ? '—' : v.toFixed(3).replace(/^0/, '');

function blockHTML(title, sub, data, fmt, tint) {
  const a = data[A] || { score: null, men: [] }, b = data[B] || { score: null, men: [] };
  const cA = PRIMARY[A] || '#26324a', cB = PRIMARY[B] || '#26324a';
  const both = a.score != null && b.score != null;
  const lead = both ? (a.score > b.score ? A : b.score > a.score ? B : null) : null;
  // Bar split: each club's share of the two numbers, so the wider half is the better club
  const total = both ? a.score + b.score : 1;
  const shareA = both ? Math.max(12, Math.min(88, a.score / total * 100)) : 50;

  const gap = both ? Math.abs(a.score - b.score) : null;
  const edge = !both ? '<span class="edge">—</span>'
    : lead == null ? '<span class="edge">Level<b>=</b></span>'
    : `<span class="edge">${esc(META[lead].abbr)} by<b>${fmt === d3 ? d3(gap) : gap}</b></span>`;

  return `<div class="block">
    <div class="block-hd"><span class="block-title">${title}</span><span class="block-sub">${sub}</span></div>
    <div class="scores">
      <div class="side">
        <span class="side-team"><img src="${logo(A)}" alt=""onerror="this.style.display='none'">${esc(META[A].abbr)}</span>
        <span class="side-num" style="color:${tint(a.score)}">${fmt(a.score)}</span>
      </div>
      ${edge}
      <div class="side b">
        <span class="side-team"><img src="${logo(B)}" alt="" onerror="this.style.display='none'">${esc(META[B].abbr)}</span>
        <span class="side-num" style="color:${tint(b.score)}">${fmt(b.score)}</span>
      </div>
    </div>
    <div class="bar"><i style="width:${shareA}%;background:${cA}"></i><i style="width:${100-shareA}%;background:${cB}"></i></div>
    <div class="rosters">
      <div class="roster">${menHTML(a.men, fmt, tint)}</div>
      <div class="roster">${menHTML(b.men, fmt, tint)}</div>
    </div>
  </div>`;
}

function menHTML(men, fmt, tint) {
  if (!men.length) return '<p class="thin">Not enough playing time to read this group yet.</p>';
  return men.map(m => {
    const c = tint(m.n);
    return `<div class="man">
      <span class="man-n" style="background:${c};color:${onTier(c)}">${fmt(m.n)}</span>
      <span class="man-name">${esc(m.name)}</span>
      ${m.slot ? `<span class="man-slot">${esc(m.slot)}</span>` : ''}
    </div>`;
  }).join('');
}

load().catch(err => {
  const board = document.getElementById('board');
  board.className = 'state';
  board.textContent = 'Could not load — ' + err.message;
});
</script>
</body>
</html>
